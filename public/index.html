<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,sans-serif}
  body{margin:0;background:#f1f5f9;color:#0f172a}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px #0001}
  h1{font-size:22px;margin:8px 0 14px}
  input,select,button{width:100%;padding:11px;margin:5px 0;border-radius:9px;border:1px solid #cbd5e1;font-size:15px}
  button{background:#4f46e5;color:#fff;border:0;cursor:pointer;font-weight:600}
  button.link{background:none;color:#4f46e5;width:auto;padding:4px}
  button.del{background:#fee2e2;color:#b91c1c;width:auto;padding:6px 10px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #e2e8f0}
  .row small{color:#64748b}
  .total{font-size:30px;font-weight:700;color:#4f46e5}
  .chip{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:20px;padding:4px 10px;margin:3px 3px 0 0;font-size:13px}
  .err{color:#b91c1c;font-size:14px}
  .hide{display:none}
  .top{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="wrap">

  <!-- Auth -->
  <div id="auth" class="card">
    <h1 id="authTitle">Login</h1>
    <input id="name" class="hide" placeholder="Naam">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <div id="authErr" class="err"></div>
    <button onclick="submitAuth()">Continue</button>
    <button class="link" onclick="toggleMode()" id="toggleBtn">Account nahi hai? Register karo</button>
  </div>

  <!-- App -->
  <div id="app" class="hide">
    <div class="top"><h1 id="hello"></h1><button class="link" onclick="logout()">Logout</button></div>
    <div class="card">
      <div>Total Kharcha</div>
      <div class="total" id="total">₹0</div>
      <div id="cats"></div>
    </div>
    <div class="card">
      <input id="title" placeholder="Kis cheez pe kharcha?">
      <input id="amount" type="number" placeholder="Amount (₹)">
      <select id="category">
        <option>Food</option><option>Travel</option><option>Shopping</option>
        <option>Bills</option><option>Study</option><option>Other</option>
      </select>
      <div id="addErr" class="err"></div>
      <button onclick="addExpense()">Add Expense</button>
    </div>
    <div class="card" id="list"></div>
  </div>
</div>

<script>
let isLogin = true;
const $ = id => document.getElementById(id);
const token = () => localStorage.getItem('token');

async function api(url, method = 'GET', body) {
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Kuch galat hua');
  return data;
}

function toggleMode() {
  isLogin = !isLogin;
  $('authTitle').textContent = isLogin ? 'Login' : 'Register';
  $('name').classList.toggle('hide', isLogin);
  $('toggleBtn').textContent = isLogin ? 'Account nahi hai? Register karo' : 'Account hai? Login karo';
  $('authErr').textContent = '';
}

async function submitAuth() {
  try {
    const data = await api(isLogin ? '/api/login' : '/api/register', 'POST', {
      name: $('name').value, email: $('email').value, password: $('password').value,
    });
    localStorage.setItem('token', data.token);
    localStorage.setItem('name', data.name);
    showApp();
  } catch (e) { $('authErr').textContent = e.message; }
}

function logout() { localStorage.clear(); location.reload(); }

async function showApp() {
  $('auth').classList.add('hide');
  $('app').classList.remove('hide');
  $('hello').textContent = 'Hi, ' + localStorage.getItem('name') + ' 👋';
  loadExpenses();
}

async function loadExpenses() {
  try {
    const items = await api('/api/expenses');
    const total = items.reduce((s, e) => s + e.amount, 0);
    $('total').textContent = '₹' + total.toLocaleString('en-IN');
    const byCat = {};
    items.forEach(e => byCat[e.category] = (byCat[e.category] || 0) + e.amount);
    $('cats').innerHTML = Object.entries(byCat).map(([c, v]) => `<span class="chip">${c}: ₹${v}</span>`).join('');
    $('list').innerHTML = items.length ? items.map(e => `
      <div class="row">
        <div><b>${e.title}</b><br><small>${e.category} • ${new Date(e.date).toLocaleDateString('en-IN')}</small></div>
        <div>₹${e.amount} <button class="del" onclick="del('${e._id}')">✕</button></div>
      </div>`).join('') : '<small>Abhi koi expense nahi hai.</small>';
  } catch { logout(); }
}

async function addExpense() {
  try {
    await api('/api/expenses', 'POST', {
      title: $('title').value, amount: +$('amount').value, category: $('category').value,
    });
    $('title').value = ''; $('amount').value = ''; $('addErr').textContent = '';
    loadExpenses();
  } catch (e) { $('addErr').textContent = e.message; }
}

async function del(id) { await api('/api/expenses/' + id, 'DELETE'); loadExpenses(); }

if (token()) showApp();
</script>
</body>
</html>
